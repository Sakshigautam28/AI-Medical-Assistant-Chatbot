<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Alpha Chatbot Widget</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary-dark: #0f172a; --accent-blue: #0ea5e9; --danger-red: #ef4444; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #sentinel-widget-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            font-family: 'Inter', sans-serif;
        }

        .sentinel-chat-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
            transition: all 0.3s ease;
            position: relative;
        }

        .sentinel-chat-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(239, 68, 68, 0.6);
        }

        .sentinel-chat-btn.active {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
        }

        .unread-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        #sentinel-chat-window {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 400px;
            height: 600px;
            background: var(--primary-dark);
            border-radius: 1.5rem;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
        }

        #sentinel-chat-window.active {
            display: flex;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { 
                transform: translateY(20px);
                opacity: 0;
            }
            to { 
                transform: translateY(0);
                opacity: 1;
            }
        }

        .sentinel-header {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            padding: 16px;
            border-radius: 1.5rem 1.5rem 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .sentinel-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sentinel-close-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 20px;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .sentinel-close-btn:hover {
            transform: rotate(90deg);
        }

        .sentinel-chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: white;
        }

        .sentinel-chat-box::-webkit-scrollbar {
            width: 4px;
        }

        .sentinel-chat-box::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        .sentinel-user-msg {
            align-self: flex-end;
            background: #1e293b;
            padding: 10px 14px;
            border-radius: 14px 14px 0 14px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sentinel-ai-msg {
            background: rgba(14, 165, 233, 0.2);
            padding: 10px 14px;
            border-radius: 14px 14px 14px 0;
            max-width: 90%;
            word-wrap: break-word;
            font-size: 13px;
            border: 1px solid rgba(14, 165, 233, 0.3);
            line-height: 1.4;
        }

        .sentinel-input-area {
            padding: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 8px;
            background: rgba(30, 41, 59, 0.5);
        }

        .sentinel-input-area input {
            flex: 1;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 12px;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
        }

        .sentinel-input-area input::placeholder {
            color: #94a3b8;
        }

        .sentinel-send-btn {
            background: #0ea5e9;
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .sentinel-send-btn:hover {
            background: #0284c7;
            transform: scale(1.05);
        }

        .sentinel-loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #0ea5e9;
            border-radius: 50%;
            animation: blink 1.4s infinite;
            margin: 0 2px;
        }

        @keyframes blink {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        .sentinel-disaster-select {
            padding: 8px 12px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #0ea5e9;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }

        .sentinel-welcome-msg {
            background: rgba(14, 165, 233, 0.1);
            padding: 12px;
            border-radius: 12px;
            border-left: 3px solid #0ea5e9;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 640px) {
            #sentinel-chat-window {
                width: calc(100vw - 40px);
                height: 500px;
            }

            .sentinel-chat-btn {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div id="sentinel-widget-container">
        <!-- Chat Button -->
        <button id="sentinel-toggle-btn" class="sentinel-chat-btn">
            <i class="fas fa-comments"></i>
            <div class="unread-badge" id="unread-count" style="display: none;">1</div>
        </button>

        <!-- Chat Window -->
        <div id="sentinel-chat-window">
            <!-- Header -->
            <div class="sentinel-header">
                <h3><i class="fas fa-robot"></i> Sentinel Alpha</h3>
                <button class="sentinel-close-btn" id="sentinel-close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Chat Box -->
            <div class="sentinel-chat-box" id="sentinel-messages">
                <div class="sentinel-welcome-msg">
                    <strong>🆘 Emergency Support Active</strong><br>
                    Describe your situation and I'll provide immediate guidance.
                </div>
            </div>

            <!-- Input Area -->
            <div class="sentinel-input-area">
                <select id="sentinel-disaster-type" class="sentinel-disaster-select">
                    <option value="medical">🏥 Medical</option>
                    <option value="flood">💧 Flood</option>
                    <option value="earthquake">⚡ Quake</option>
                    <option value="fire">🔥 Fire</option>
                </select>
                <input type="text" id="sentinel-chat-input" placeholder="Type your problem..." />
                <button class="sentinel-send-btn" id="sentinel-send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ===== CONFIGURATION =====
        const BACKEND_URL = window.sentinelConfig?.backendUrl || "http://localhost:5000";
        const SESSION_ID = "widget_" + Math.random().toString(36).substring(7);
        
        // ===== DOM ELEMENTS =====
        const toggleBtn = document.getElementById('sentinel-toggle-btn');
        const closeBtn = document.getElementById('sentinel-close-btn');
        const chatWindow = document.getElementById('sentinel-chat-window');
        const messagesBox = document.getElementById('sentinel-messages');
        const chatInput = document.getElementById('sentinel-chat-input');
        const sendBtn = document.getElementById('sentinel-send-btn');
        const disasterSelect = document.getElementById('sentinel-disaster-type');
        const unreadBadge = document.getElementById('unread-count');

        let unreadCount = 0;
        let isOpen = false;

        // ===== EVENT LISTENERS =====
        toggleBtn.addEventListener('click', toggleChat);
        closeBtn.addEventListener('click', closeChat);
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // ===== FUNCTIONS =====
        function toggleChat() {
            isOpen ? closeChat() : openChat();
        }

        function openChat() {
            isOpen = true;
            chatWindow.classList.add('active');
            toggleBtn.classList.add('active');
            unreadBadge.style.display = 'none';
            unreadCount = 0;
            chatInput.focus();
        }

        function closeChat() {
            isOpen = false;
            chatWindow.classList.remove('active');
            toggleBtn.classList.remove('active');
        }

        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            // Add user message to chat
            addMessage(message, 'user');
            chatInput.value = '';

            // Show loading indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'sentinel-ai-msg';
            loadingDiv.innerHTML = '<div class="sentinel-loading"></div><div class="sentinel-loading"></div><div class="sentinel-loading"></div>';
            messagesBox.appendChild(loadingDiv);
            messagesBox.scrollTop = messagesBox.scrollHeight;

            try {
                const response = await fetch(`${BACKEND_URL}/chatbot`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: SESSION_ID,
                        symptoms: message,
                        disaster: disasterSelect.value,
                        lat: 0,
                        lng: 0
                    })
                });

                if (!response.ok) throw new Error('Backend error');

                const data = await response.json();
                const reply = data.advice?.[0] || 'Unable to process your request.';

                // Remove loading indicator
                loadingDiv.remove();

                // Add AI message
                addMessage(reply, 'ai');

            } catch (error) {
                loadingDiv.remove();
                addMessage('❌ Connection failed. Please check the backend is running.', 'ai');
                console.error('Error:', error);
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            
            if (sender === 'user') {
                messageDiv.className = 'sentinel-user-msg';
            } else {
                messageDiv.className = 'sentinel-ai-msg';
            }

            // Truncate very long messages in widget view
            const displayText = text.length > 500 ? text.substring(0, 500) + '... [See full response in main app]' : text;
            messageDiv.textContent = displayText;
            
            messagesBox.appendChild(messageDiv);
            messagesBox.scrollTop = messagesBox.scrollHeight;

            // Show unread badge when window is closed
            if (sender === 'ai' && !isOpen) {
                unreadCount++;
                unreadBadge.textContent = unreadCount;
                unreadBadge.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
